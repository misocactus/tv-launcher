<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Room</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#080a0d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:#fff}
  #stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center center}

  .bg{position:absolute;inset:0;overflow:hidden;transition:background 600ms ease-out}
  .bg .blob{position:absolute;filter:blur(100px);border-radius:50%;opacity:.55;transition:background 600ms ease-out}
  .bg .b1{width:1150px;height:1150px;left:-240px;top:-380px;background:radial-gradient(circle,#2a4a72,#101a28 70%)}
  .bg .b2{width:1000px;height:1000px;right:-260px;top:-200px;background:radial-gradient(circle,#5f3a63,#1d1626 70%)}
  .grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='170' height='170' filter='url(%23n)' opacity='.5'/></svg>")}
  .vign{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.10) 28%,rgba(0,0,0,.55) 100%),
    radial-gradient(120% 100% at 50% 30%,transparent 45%,rgba(0,0,0,.5) 100%)}

  .shell{position:absolute;inset:0;padding:46px 80px 44px;display:flex;flex-direction:column}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .meta .clock{font-size:25px;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
  .meta .who{font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.42}

  .dock{align-self:flex-start;display:flex;gap:22px;padding:18px;border-radius:30px;
    background:rgba(255,255,255,.085);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 22px 56px rgba(0,0,0,.4);
    backdrop-filter:blur(22px) saturate(140%);margin-bottom:24px}

  .shelf{height:206px;display:flex;flex-direction:column;margin-bottom:26px}
  .shelf .head{display:flex;align-items:baseline;gap:12px;padding-left:4px}
  .shelf .head .name{font-size:20px;font-weight:650}
  .shelf .head .note{font-size:16px;color:rgba(255,255,255,.5)}
  .cards{display:flex;gap:20px;margin-top:16px;flex:1;opacity:0;transform:translateY(8px);
    transition:opacity 240ms ease-out,transform 240ms cubic-bezier(.2,0,0,1)}
  .cards.in{opacity:1;transform:none}
  .card{width:400px;border-radius:18px;position:relative;overflow:hidden;
    background:rgba(255,255,255,.075);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 16px 34px rgba(0,0,0,.32);
    backdrop-filter:blur(12px)}
  .card .txt{position:absolute;left:18px;right:18px;bottom:16px}
  .card .txt .t{font-size:18px;font-weight:600}
  .card .txt .s{margin-top:4px;font-size:13.5px;opacity:.6}
  .card .tint{position:absolute;inset:0}
  .strip{flex:1;display:none;align-items:flex-end;justify-content:space-between;padding:26px 30px;
    border-radius:18px;position:relative;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 18px 40px rgba(0,0,0,.35)}
  .strip .wash{position:absolute;inset:0}
  .strip .txt{position:relative;display:flex;flex-direction:column;gap:8px}
  .strip .txt b{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .strip .txt span{font-size:17px;color:rgba(255,255,255,.62)}
  .strip .open{position:relative;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.28);border-radius:999px;
    padding:11px 20px}

  .grid{display:flex;flex-direction:column;gap:20px}
  .row{display:flex;gap:22px;flex-wrap:nowrap;overflow:hidden}

  .tile{position:relative;flex:0 0 auto;display:grid;place-items:center;border-radius:22px;
    cursor:pointer;overflow:hidden;transform:translateZ(0);
    transition:transform 185ms cubic-bezier(.2,0,0,1),box-shadow 185ms cubic-bezier(.2,0,0,1)}
  .tile::after{content:"";position:absolute;inset:0;border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
  .dock .tile{width:148px;height:148px;border-radius:22px}
  .grid .tile{width:188px;height:188px}
  .tile.focused{transform:scale(1.07);
    box-shadow:0 26px 54px -10px rgba(0,0,0,.62),0 0 0 3px rgba(255,255,255,.9),
               0 0 40px 4px rgba(140,190,255,.16)}

  .lg{font-weight:800;letter-spacing:-.02em;text-align:center;line-height:1.05;padding:0 10px;
    font-size:22px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg.sm{font-size:17px}
  .icon{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  .tile.hasicon .icon{display:block}
  .tile.hasicon .lg{display:none}

  .debug{position:absolute;inset:60px 80px;background:rgba(6,8,11,.96);border-radius:24px;
    padding:36px;display:none;overflow:auto;font-size:19px;line-height:1.6;
    box-shadow:0 0 0 2px rgba(255,255,255,.18)}
  .debug.on{display:block}
  .debug h3{font-size:24px;margin-bottom:14px}
  .debug .line{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;
    color:#cfe3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .debug .hint{color:#8aa;margin-top:16px;font-size:15px}
</style>
</head>
<body>

  <div class="bg" id="bg">
    <div class="blob b1"></div><div class="blob b2" id="b2"></div>

  </div>

  <div class="shell">
    <div class="meta">
      <div class="clock" id="clock">--:--</div>
      <div class="who" id="who">Living room · Frame 55</div>
    </div>
    <div class="dock" id="dock" data-role="dock"></div>
    <div class="shelf">
      <div class="head"><div class="name" id="sName">—</div><div class="note" id="sNote"></div></div>

        <div class="wash" id="stripWash"></div>
        <div class="txt"><b id="stripName">—</b><span>Nothing to preview here — open it to browse.</span></div>

    <div class="grid" id="grid"></div>
  </div>

  <div class="debug" id="debug"></div>
</div>

  const toBuf = (b64) => { const bin = atob(b64); const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a.buffer; };
  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    for (const k in raw) ctx.decodeAudioData(toBuf(raw[k]), b => { buffers[k] = b; }, () => {});
  }
  function play(name, gain){
    if (!enabled || !ctx || !buffers[name]) return;
    const s = ctx.createBufferSource(); s.buffer = buffers[name];
    const g = ctx.createGain(); g.gain.value = gain;
    s.connect(g); g.connect(ctx.destination); s.start();
  }
  return {
    unlock(){ init(); if (ctx && ctx.state === 'suspended') ctx.resume(); },
    tick(){ const n = performance.now(); if (n - lastTick < 40) return; lastTick = n; play('tick', .34); },
    launch(){ play('launch', .72) },
    back(){ play('back', .5) },
    toggle(){ enabled = !enabled; return enabled; }
  };
})();

/* ---------------- app discovery ---------------- */
const PRIORITY = /netflix|youtube|prime video|disney|apple\s?tv|stan|binge|iview|sbs|9now|10 ?play|kayo|plex|spotify|jellyfin/i;
const HIDE = /tizenbrew|universal guide|samsung tv plus|samsungtvplus|^(settings|app list|home)$/i;
const HIDE_ID = /xvvl3S1bvH/i;

function discover(){
  const out = [];
  try {
    if (window.tizen && tizen.application && tizen.application.getAppsContext) {
      const ctxs = tizen.application.getAppsContext();
      const seen = new Set();
      for (const c of ctxs){
        let info = null;
        try { info = tizen.application.getAppInfo(c.appId); } catch(e){}
        const id = c.appId;
        const name = (info && info.name) ? info.name : id;
        if (HIDE.test(name) || HIDE_ID.test(id)) continue;
        if (seen.has(name.toLowerCase())) continue;
        seen.add(name.toLowerCase());
        out.push({ id, name, icon: (info && info.iconPath) || null });
      }
    }
  } catch (e) { console.error('discovery failed', e); }
  if (!out.length){
    // browser preview / preview-mode fallback
    ['Netflix','YouTube','Prime Video','Disney+','Apple TV+','Stan','ABC iview','SBS On Demand','9Now','10 Play','Kayo','Plex','Spotify','Family','Kids','Tonight']
      .forEach(n => out.push({ id: 'demo.' + n.replace(/\W+/g,''), name: n, icon: null }));
  }
  return out;
}

const SHELF = {
  youtube: { note: 'ad-free · SponsorBlock on', cards: [['Subscriptions','12 new today'],['Watch later','37 videos'],['Liked','1,204']] },
  netflix: { note: 'no previews available from this app' },
  prime:   { note: 'no previews available from this app' },
  disney:  { note: 'no previews available from this app' },
  family:  { note: 'your own app', cards: [['Photos','1,204 · since Barcelona 2009'],['Next birthday','9 May'],['This weekend','nothing planned']] },
  kids:    { note: 'pinned apps only', cards: [['Bluey','S3 · 8 offline'],['Play School','most recent'],['Homework','2 due Fri']] },
  tonight: { note: 'WhatSupper plan', cards: [['Tonight','Miso butter salmon'],['Shopping','3 items in cart'],['This week','4 dinners planned']] },
};
const key = (n) => n.toLowerCase().replace(/[^a-z]/g,'').slice(0,12);
function shelfFor(app){
  const k = key(app.name);
  for (const s in SHELF) if (k.startsWith(s)) return SHELF[s];
  return { note: 'no previews available from this app' };
}

const TINT = { netflix:'#5a0d12', youtube:'#3a0a0a', primevideo:'#0b3a58', disney:'#132a63',
  appletv:'#1a1a1f', stan:'#0a2ea8', binge:'#151515', abciview:'#3d3d3d', sbsondemand:'#101010',
  now:'#0b3fa8', play:'#1b6ef3', kayo:'#0d0d0d', plex:'#e5a00d', spotify:'#1db954',
  family:'#8d5b4c', kids:'#ef476f', tonight:'#2f7d63' };
const tintFor = (name) => TINT[key(name)] || '#232a33';

/* ---------------- layout ---------------- */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

const dockEl = document.getElementById('dock');
const gridEl = document.getElementById('grid');
let rows = [];   // array of arrays of tile elements
let focus = { r: 0, c: 0 };
let current = null;

function makeTile(app){
  const t = document.createElement('div');
  t.className = 'tile';
  t.dataset.appid = app.id;
  t.dataset.name = app.name;
  t.style.background = tintFor(app.name);
  const lg = document.createElement('div');
  lg.className = 'lg' + (app.name.length > 12 ? ' sm' : '');
  lg.textContent = app.name;
  t.appendChild(lg);
  if (app.icon){
    const img = document.createElement('img');
    img.className = 'icon';
    img.src = app.icon;
    img.onload = () => t.classList.add('hasicon');
    img.onerror = () => { img.remove(); };
    t.appendChild(img);
  }
  return t;
}

function render(apps){
  dockEl.innerHTML = ''; gridEl.innerHTML = ''; rows = [];
  const favs = apps.filter(a => PRIORITY.test(a.name)).slice(0, 6);
  const rest = apps.filter(a => !favs.includes(a));
  const dockRow = [];
  favs.forEach(a => { const t = makeTile(a); dockEl.appendChild(t); dockRow.push(t); });
  if (dockRow.length) rows.push(dockRow);

  for (let i = 0; i < rest.length; i += 6){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    const rowTiles = [];
    rest.slice(i, i + 6).forEach(a => { const t = makeTile(a); rowEl.appendChild(t); rowTiles.push(t); });
    gridEl.appendChild(rowEl);
    rows.push(rowTiles);
  }
  focus = { r: 0, c: 0 };
  paint();
}

function paint(){
  document.querySelectorAll('.tile.focused').forEach(t => t.classList.remove('focused'));
  const row = rows[focus.r]; if (!row) return;
  const tile = row[focus.c]; if (!tile) return;
  tile.classList.add('focused');
  current = { id: tile.dataset.appid, name: tile.dataset.name };
  updateShelf(current);
}

function updateShelf(app){
  const s = shelfFor(app);
  document.getElementById('sName').textContent = app.name;
  document.getElementById('sNote').textContent = s.note ? '· ' + s.note : '';
  const cards = document.getElementById('cards');
  const strip = document.getElementById('strip');
  if (s.cards){
    strip.style.display = 'none'; cards.style.display = 'flex';
    cards.innerHTML = s.cards.map(([t, sub]) =>
      `<div class="card"><div class="tint" style="background:linear-gradient(140deg,rgba(255,255,255,.10),rgba(255,255,255,.02))"></div>
       <div class="txt"><div class="t">${t}</div><div class="s">${sub}</div></div></div>`).join('');
    cards.classList.remove('in'); void cards.offsetWidth; cards.classList.add('in');
  } else {
    cards.style.display = 'none'; strip.style.display = 'flex';
    document.getElementById('stripName').textContent = app.name;
    document.getElementById('stripWash').style.background =
      `linear-gradient(135deg,${tintFor(app.name)} 0%,rgba(0,0,0,.55) 78%)`;
  }
  document.getElementById('b2').style.background = `radial-gradient(circle,${tintFor(app.name)},#141018 72%)`;
}

function move(dr, dc){
  const nr = focus.r + dr;
  if (nr < 0 || nr >= rows.length){ return; }
  if (dc){ const nc = focus.c + dc; if (nc < 0 || nc >= rows[nr].length) return; focus = { r: nr, c: nc }; }
  else { focus = { r: nr, c: Math.min(focus.c, rows[nr].length - 1) }; }
  SFX.tick(); paint();
}

function launch(app){
  if (!app) return;
  if (window.tizen && tizen.application && tizen.application.launch){
    try { tizen.application.launch(app.id, () => {}, (e) => console.error('launch failed', e)); }
    catch (e) { console.error(e); }
  } else {
    console.log('[preview] launch', app.id);
  }
}

/* ---------------- debug panel ---------------- */
const debugEl = document.getElementById('debug');
let debugOn = false;
function toggleDebug(){
  debugOn = !debugOn;
  debugEl.classList.toggle('on', debugOn);
  if (!debugOn) return;
  const apps = APP_LIST;
  debugEl.innerHTML = `<h3>Installed apps (${apps.length}) — press D to close</h3>` +
    apps.map(a => `<div class="line">${a.id} · ${a.name} · ${a.icon || 'no icon'}</div>`).join('') +
    `<div class="hint">Screenshot this and send it. It tells me the real app IDs to pin.</div>`;
}

/* ---------------- keys ---------------- */
let APP_LIST = [];
addEventListener('keydown', (e) => {
  SFX.unlock();
  const k = e.keyCode;
  if (k === 68 || k === 10009 && false) { toggleDebug(); e.preventDefault(); return; }
  if (k === 13) { SFX.launch(); launch(current); e.preventDefault(); return; }
  if (k === 10009 || k === 8) { SFX.back(); if (debugOn) toggleDebug(); e.preventDefault(); return; }
  if (k === 37) { move(0, -1); e.preventDefault(); return; }
  if (k === 39) { move(0, 1); e.preventDefault(); return; }
  if (k === 38) { move(-1, 0); e.preventDefault(); return; }
  if (k === 40) { move(1, 0); e.preventDefault(); return; }
}, true);

setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}, 5000);
document.getElementById('clock').textContent = (() => {
  const d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
})();

APP_LIST = discover();
render(APP_LIST);
setTimeout(paint, 50);
</script>
